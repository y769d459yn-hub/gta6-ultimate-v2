<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Encyclopédie - GTA 6 Ultimate</title>
  <style>
    body { margin:0; font-family:-apple-system,Helvetica,sans-serif;
           background:#0b0b12; color:#fff; }
    header { padding:32px 20px; background:linear-gradient(135deg,#ff2e93,#7b2ff7); }
    h1 { margin:0; font-size:1.6rem; }
    main { padding:20px; display:grid; gap:12px; }
    .fiche { background:#1a1a26; border-radius:12px; padding:16px; }
    .fiche h2 { margin:0 0 8px; font-size:1.1rem; }
    .statut { display:inline-block; padding:4px 10px; border-radius:20px;
              font-size:.75rem; background:#2a6b3c; }
    .statut.rumeur { background:#8a6d1a; }
    .source { font-size:.8rem; opacity:.7; margin-top:8px; }
    a.retour { display:inline-block; margin:0 20px 20px; color:#ff7ac0; }
  </style>
</head>
<body>
  <header><h1>📖 Encyclopédie</h1></header>
  <main>
    <div class="fiche">
      <h2>Lucia</h2>
      <span class="statut">✅ Confirmé</span>
      <p>Personnage présenté dans la bande-annonce officielle.</p>
      <div class="source">Source : bande-annonce Rockstar Games (exemple à vérifier)</div>
    </div>
    <div class="fiche">
      <h2>Exemple de fiche non confirmée</h2>
      <span class="statut rumeur">⚠️ Non confirmé</span>
      <p>Les informations sans source officielle auront toujours cette étiquette.</p>
    </div>
  </main>
  <a class="retour" href="index.html">← Retour à l'accueil</a>
</body>
</html>
