# Vérifie chaque proposition de modification avant fusion : le site se construit et passe les contrôles
# (liens internes, titres, descriptions, canonical, plan du site, données structurées).
name: Vérifier le site

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Construire et contrôler
        run: npm test
