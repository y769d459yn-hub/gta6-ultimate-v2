<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carte - GTA 6 Ultimate</title>
  <style>
    body { margin:0; font-family:-apple-system,Helvetica,sans-serif;
           background:#0b0b12; color:#fff; }
    header { padding:32px 20px; background:linear-gradient(135deg,#ff2e93,#7b2ff7); }
    h1 { margin:0; font-size:1.6rem; }
    .regle { margin:20px 20px 0; padding:12px; border-radius:12px;
             background:#1a1a26; font-size:.85rem; opacity:.9; }
    #carte { position:relative; margin:20px; height:380px; border-radius:16px;
             background:linear-gradient(160deg,#16324a,#1a1a26);
             border:1px solid #2c2c40; overflow:hidden; }
    .point { position:absolute; width:28px; height:28px; margin:-14px 0 0 -14px;
             border-radius:50%; border:3px solid #fff; background:#ff2e93;
             cursor:pointer; }
    .point.rumeur { background:#c99a1f; }
    #fiche { margin:0 20px 20px; padding:16px; border-radius:12px;
             background:#1a1a26; min-height:70px; }
    #fiche h2 { margin:0 0 6px; font-size:1.05rem; }
    .statut { display:inline-block; padding:4px 10px; border-radius:20px;
              font-size:.75rem; background:#2a6b3c; }
    .statut.rumeur { background:#8a6d1a; }
    a.retour { display:inline-block; margin:0 20px 20px; color:#ff7ac0; }
  </style>
</head>
<body>
  <header><h1>🗺️ Carte interactive</h1></header>
  <div class="regle">
    Carte provisoire : les emplacements sont des exemples et ne
    représentent pas la vraie carte du jeu.
  </div>
  <div id="carte">
    <div class="point" style="left:30%;top:35%" data-nom="Exemple de lieu A"
         data-statut="Confirmé" data-texte="Fiche à remplir avec une source officielle."></div>
    <div class="point rumeur" style="left:65%;top:60%" data-nom="Exemple de lieu B"
         data-statut="Non confirmé" data-texte="Lieu issu d'une rumeur, en attente de vérification."></div>
  </div>
  <div id="fiche">Appuie sur un point de la carte.</div>
  <a class="retour" href="index.html">← Retour à l'accueil</a>
  <script>
    var fiche = document.getElementById("fiche");
    document.querySelectorAll(".point").forEach(function (p) {
      p.addEventListener("click", function () {
        var ok = p.dataset.statut === "Confirmé";
        fiche.innerHTML = "<h2></h2><span class='statut'></span><p></p>";
        fiche.querySelector("h2").textContent = p.dataset.nom;
        var s = fiche.querySelector(".statut");
        s.textContent = (ok ? "✅ " : "⚠️ ") + p.dataset.statut;
        if (!ok) s.classList.add("rumeur");
        fiche.querySelector("p").textContent = p.dataset.texte;
      });
    });
  </script>
</body>
</html>
